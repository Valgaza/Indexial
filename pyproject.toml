[project]
name = "indexial"
version = "0.1.0"
description = "RAG pipeline with semantic chunking and SQL table extraction"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.1.1",
    "flask==3.1.2",
    "torch==2.9.0",
    "transformers==4.57.1",
    "openai==1.3.7",
    "PyPDF2>=3.0.1",
    "python-docx>=1.1.0",
    "qdrant-client>=1.15.1",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic>=2.5.0",
    "boto3>=1.35.0",
    "psycopg2-binary>=2.9.9",
    "python-dateutil>=2.8.2",
    "semchunk>=3.0.0",
    "tiktoken>=0.5.0",
    "requests>=2.32.5",
    "PyMuPDF>=1.16",
]

# =============================================================================
# UV MIGRATION GUIDE
# =============================================================================
#
# OLD WORKFLOW (pip)              →  NEW WORKFLOW (uv)
# ─────────────────────────────────────────────────────────────────────────────
# pip install -r requirements.txt →  uv sync
# python script.py                →  uv run python script.py
# pip install package             →  uv add package
# pip install package --upgrade   →  uv add package --upgrade
# pip freeze                      →  uv pip freeze
#
# INITIAL MIGRATION STEPS:
# ─────────────────────────────────────────────────────────────────────────────
# 1. Create virtual environment:   uv venv
# 2. Sync all dependencies:        uv sync
# 3. Verify installation:          uv run python -c "import flask; print('OK')"
# 4. Run scripts:                  uv run python extractor.py
#
# COMMON COMMANDS:
# ─────────────────────────────────────────────────────────────────────────────
# Add new dependency:              uv add requests
# Add dev dependency:              uv add --dev pytest
# Remove dependency:               uv remove package-name
# Update all dependencies:         uv sync --upgrade
# Update specific package:         uv add package-name --upgrade
# Lock dependencies:               uv lock
# Show installed packages:         uv pip list
# Activate venv manually:          source .venv/bin/activate  (macOS/Linux)
#                                  .venv\Scripts\activate     (Windows)
#
# NOTES:
# ─────────────────────────────────────────────────────────────────────────────
# - uv is 10-100x faster than pip
# - uv.lock file tracks exact versions (commit this to git)
# - .venv/ directory contains the virtual environment (don't commit)
# - requirements.txt kept as backup until migration verified
# =============================================================================
