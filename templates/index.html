<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indexial - Document Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .main {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .upload-box {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-box:hover {
            border-color: #667eea;
            background: #f9fafb;
        }

        .upload-box input {
            display: none;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }

        .doc-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .doc-item {
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .doc-name {
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }

        .doc-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-processing {
            background: #fef3c7;
            color: #92400e;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message-user .message-bubble {
            background: #667eea;
            color: white;
        }

        .message-assistant .message-bubble {
            background: #f3f4f6;
            color: #374151;
        }

        .message-meta {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .route-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }

        .route-sql {
            background: #dbeafe;
            color: #1e40af;
        }

        .route-rag {
            background: #fce7f3;
            color: #9f1239;
        }

        .route-hybrid {
            background: #e0e7ff;
            color: #3730a3;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding-top: 20px;
            border-top: 2px solid #f3f4f6;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .session-info {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .session-id {
            font-family: 'Courier New', monospace;
            color: #667eea;
            font-weight: 600;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #d1d5db;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sql-info {
            background: #f0f9ff;
            border-left: 3px solid #0ea5e9;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .sql-code {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-top: 4px;
            overflow-x: auto;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2 style="color: #667eea; margin-bottom: 20px;">Indexial</h2>

            <!-- Upload Section -->
            <div class="section">
                <h3>Upload Document</h3>
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept=".pdf">
                    <div style="font-size: 14px; color: #6b7280;">
                        📄 Click to upload PDF
                    </div>
                </div>
                <button class="btn" id="uploadBtn" disabled>Upload</button>
            </div>

            <!-- Documents Section -->
            <div class="section">
                <h3>Documents</h3>
                <div class="doc-list" id="docList">
                    <div style="text-align: center; color: #9ca3af; padding: 20px;">
                        Loading...
                    </div>
                </div>
                <button class="btn btn-small" onclick="loadDocuments()">Refresh</button>
            </div>

            <!-- Session Section -->
            <div class="section">
                <h3>Session</h3>
                <button class="btn btn-small" onclick="clearSession()">Clear History</button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main">
            <h1>Document Intelligence</h1>
            <div class="subtitle">Ask questions about your documents</div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('chat')">Chat</div>
                <div class="tab" onclick="switchTab('tables')">Tables</div>
            </div>

            <!-- Chat Tab -->
            <div class="tab-content active" id="chatTab">
                <div class="session-info">
                    Session: <span class="session-id" id="sessionId"></span>
                </div>

                <div class="chat-container">
                    <div class="messages" id="messages">
                        <div style="text-align: center; color: #9ca3af; padding: 40px;">
                            👋 Hi! Upload a document and ask me anything about it.
                        </div>
                    </div>

                    <div class="input-area">
                        <input
                            type="text"
                            id="queryInput"
                            placeholder="Ask a question..."
                            onkeypress="if(event.key==='Enter') sendQuery()"
                        >
                        <button class="btn" onclick="sendQuery()">Send</button>
                    </div>
                </div>
            </div>

            <!-- Tables Tab -->
            <div class="tab-content" id="tablesTab">
                <div id="tablesList" style="overflow-y: auto; max-height: calc(100vh - 250px);">
                    Loading tables...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let sessionId = generateSessionId();

        // Initialize
        document.getElementById('sessionId').textContent = sessionId;
        loadDocuments();
        loadTables();

        // File input handling
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = !e.target.files.length;
        });

        function generateSessionId() {
            return 'session_' + Math.random().toString(36).substring(7);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');

            if (tab === 'tables') {
                loadTables();
            }
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = 'Uploading...';

            try {
                const response = await fetch(`${API_URL}/api/documents/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Document uploaded successfully!');
                    fileInput.value = '';
                    loadDocuments();
                } else {
                    alert('Upload failed: ' + data.error);
                }
            } catch (error) {
                alert('Upload error: ' + error.message);
            } finally {
                btn.textContent = 'Upload';
                btn.disabled = false;
            }
        }

        document.getElementById('uploadBtn').addEventListener('click', uploadDocument);

        async function loadDocuments() {
            try {
                const response = await fetch(`${API_URL}/api/documents?limit=10`);
                const data = await response.json();

                const docList = document.getElementById('docList');

                if (data.documents.length === 0) {
                    docList.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 20px;">No documents</div>';
                    return;
                }

                docList.innerHTML = data.documents.map(doc => `
                    <div class="doc-item">
                        <div class="doc-name">${doc.filename}</div>
                        <span class="doc-status status-${doc.status}">
                            ${doc.status}
                        </span>
                        ${doc.table_count ? `<div style="font-size: 11px; color: #6b7280; margin-top: 4px;">
                            ${doc.table_count} tables, ${doc.chunk_count} chunks
                        </div>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load documents:', error);
            }
        }

        async function loadTables() {
            try {
                const response = await fetch(`${API_URL}/api/tables`);
                const data = await response.json();

                const tablesList = document.getElementById('tablesList');

                if (data.tables.length === 0) {
                    tablesList.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 40px;">No tables found</div>';
                    return;
                }

                tablesList.innerHTML = data.tables.map(table => `
                    <div style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                        <div style="font-weight: 600; color: #374151; margin-bottom: 8px;">
                            ${table.physical_table_name}
                        </div>
                        <div style="font-size: 13px; color: #6b7280; margin-bottom: 8px;">
                            ${table.semantic_description || 'No description'}
                        </div>
                        <div style="font-size: 12px; color: #9ca3af;">
                            <strong>Headers:</strong> ${table.headers.join(', ')}
                        </div>
                        <div style="font-size: 12px; color: #9ca3af;">
                            <strong>Rows:</strong> ${table.row_count} | <strong>Source:</strong> ${table.original_filename}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load tables:', error);
            }
        }

        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();

            if (!query) return;

            // Add user message
            addMessage('user', query);
            input.value = '';

            // Add loading indicator
            const messagesDiv = document.getElementById('messages');
            const loadingId = 'loading_' + Date.now();
            messagesDiv.innerHTML += `
                <div class="message message-assistant" id="${loadingId}">
                    <div class="message-bubble">
                        <span class="loading"></span>Thinking...
                    </div>
                </div>
            `;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        session_id: sessionId
                    })
                });

                const data = await response.json();

                // Remove loading indicator
                document.getElementById(loadingId).remove();

                // Add assistant response
                addMessage('assistant', data.answer, data);
            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage('assistant', 'Error: ' + error.message);
            }
        }

        function addMessage(role, content, data = {}) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${role}`;

            let metaInfo = '';
            if (data.route) {
                metaInfo = `<span class="route-badge route-${data.route.toLowerCase()}">${data.route}</span>`;
            }
            if (data.rewritten_query) {
                metaInfo += `<div style="font-size: 11px; margin-top: 4px;">Rewritten: "${data.rewritten_query}"</div>`;
            }

            let sqlInfo = '';
            if (data.sql) {
                sqlInfo = `
                    <div class="sql-info">
                        <div><strong>SQL Query:</strong></div>
                        <div class="sql-code">${escapeHtml(data.sql)}</div>
                        ${data.tables_used ? `<div style="margin-top: 4px;"><strong>Tables:</strong> ${data.tables_used.join(', ')}</div>` : ''}
                    </div>
                `;
            }

            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${escapeHtml(content)}
                    ${sqlInfo}
                </div>
                ${metaInfo ? `<div class="message-meta">${metaInfo}</div>` : ''}
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function clearSession() {
            if (!confirm('Clear conversation history?')) return;

            try {
                await fetch(`${API_URL}/api/sessions/${sessionId}/clear`, {
                    method: 'POST'
                });

                document.getElementById('messages').innerHTML = `
                    <div style="text-align: center; color: #9ca3af; padding: 40px;">
                        Session cleared. Start a new conversation!
                    </div>
                `;

                // Generate new session
                sessionId = generateSessionId();
                document.getElementById('sessionId').textContent = sessionId;
            } catch (error) {
                alert('Failed to clear session: ' + error.message);
            }
        }

        // Refresh documents periodically
        setInterval(loadDocuments, 10000);
    </script>
</body>
</html>
